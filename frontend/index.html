<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBV VoiceTranscrypt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            <h1>DBV VoiceTranscrypt</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </header>

    <main class="container">
        <section class="upload-section">
            <div class="dropzone" id="dropzone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <h2>Arrastra tus archivos de audio</h2>
                <p>Puedes subir varios archivos .wav, .mp3, etc. y ordenarlos después.</p>
                <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
            </div>

            <!-- Lista de Archivos de la Sesión -->
            <div id="file-list-container" class="file-list-container hidden">
                <div class="file-list-header">
                    <h3>Archivos en la sesión</h3>
                    <button id="clear-session-btn" class="btn-text">Limpiar Todo</button>
                </div>
                <ul id="file-list" class="file-list"></ul>
                <button id="process-session-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-play"></i> Procesar Sesión Completa
                </button>
            </div>

            
            <div id="upload-progress" class="progress-container hidden">
                <div class="progress-header">
                    <span id="file-name-display">archivo.wav</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <p id="status-message" class="status-message">Subiendo...</p>
                <div id="status-console" class="status-console"></div>
            </div>
        </section>

        <section class="result-section hidden" id="result-section">
            <div class="result-header">
                <h2>Transcripción</h2>
                <div class="actions">
                    <button class="btn btn-secondary" id="copy-btn">Copiar Texto</button>
                    <!-- Fase 2 botones preparados: -->
                    <button class="btn btn-primary hidden" id="summarize-btn">Generar Resumen</button>
                </div>
            </div>
            <div class="transcription-box">
                <p id="transcription-text"></p>
            </div>
        </section>

        <section class="ai-section hidden" id="ai-section">
            <div class="ai-header">
                <h2>Análisis con IA</h2>
                <div class="ai-settings">
                    <select id="ai-model" class="input-field">
                        <optgroup label="Google Gemini">
                            <option value="gemini-1.5-flash" data-provider="gemini">Gemini 1.5 Flash</option>
                            <option value="gemini-1.5-pro" data-provider="gemini">Gemini 1.5 Pro</option>
                            <option value="gemini-2.0-flash" data-provider="gemini">Gemini 2.0 Flash</option>
                            <option value="gemini-2.0-pro-exp" data-provider="gemini">Gemini 2.0 Pro (Exp)</option>
                            <option value="gemini-2.5-flash" data-provider="gemini">Gemini 2.5 Flash</option>
                            <option value="gemini-3-flash-preview" data-provider="gemini" selected>Gemini 3 Flash (Preview)</option>
                            <option value="gemini-3.1-pro-preview" data-provider="gemini">Gemini 3.1 Pro (Preview)</option>
                        </optgroup>
                        <optgroup label="Modelos Locales">
                            <option value="gemma-4" data-provider="gemma-local">Gemma 4 (Local)</option>
                        </optgroup>
                    </select>
                    <input type="password" id="api-key" class="input-field" placeholder="API Key de Gemini..." />
                    <button id="save-key-btn" class="btn btn-secondary">Guardar Key</button>
                </div>
            </div>
            
            <div class="ai-options">
                <button class="ai-option-card" data-type="summary">
                    <span class="icon">📄</span>
                    <span>Resumen Ejecutivo</span>
                </button>
                <button class="ai-option-card" data-type="concepts">
                    <span class="icon">📝</span>
                    <span>Conceptos Clave</span>
                </button>
                <button class="ai-option-card" data-type="actions">
                    <span class="icon">✅</span>
                    <span>Action Items</span>
                </button>
                <button class="ai-option-card" data-type="mindmap">
                    <span class="icon">🧠</span>
                    <span>Estructura / Mapa</span>
                </button>
                <button class="ai-option-card" data-type="template">
                    <span class="icon">📋</span>
                    <span>Plantilla Inteligente</span>
                </button>
                <button class="ai-option-card" data-type="full_content">
                    <span class="icon">📖</span>
                    <span>Contenido Completo</span>
                </button>
                <button class="ai-option-card" data-type="qa">
                    <span class="icon">❓</span>
                    <span>Preguntas y Respuestas</span>
                </button>
                <button class="ai-option-card" data-type="followup">
                    <span class="icon">✉️</span>
                    <span>Email Seguimiento</span>
                </button>
                <button class="ai-option-card" data-type="sentiment">
                    <span class="icon">🎭</span>
                    <span>Tono y Sentimiento</span>
                </button>
                <button class="ai-option-card" data-type="custom">
                    <span class="icon">✨</span>
                    <span>Prompt Personalizado</span>
                </button>
            </div>

            <div id="custom-prompt-container" class="custom-prompt-container hidden">
                <textarea id="custom-prompt-input" class="input-field" placeholder="Escribe aquí tus instrucciones personalizadas... (ej: 'Traduce al inglés y resume')"></textarea>
                <button id="run-custom-prompt-btn" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
                    <i class="fas fa-magic"></i> Ejecutar Instrucción Personalizada
                </button>
            </div>





            <div id="ai-result-container" class="hidden">
                <div class="ai-result-header">
                    <h3>Resultado</h3>
                    <button class="btn btn-secondary" id="copy-ai-btn">Copiar</button>
                </div>
                <div id="ai-result-content" class="transcription-box markdown-body"></div>
            </div>
        </section>
    </main>

    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
